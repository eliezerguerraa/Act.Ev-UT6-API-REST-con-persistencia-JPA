# ===========================
# Configuración de base de datos
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3308/musicapi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# Configuración JPA / Hibernate
# ===========================
# update: crea las tablas si no existen y las actualiza si cambia el modelo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# Servidor
# ===========================
server.port=8080
